# Build Thermal Leak Detector for Windows and macOS (no Mac required locally)
name: Build Windows and macOS

on:
  push:
    branches: [main, master, feat/detect_leak_app]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: Avans-thermal-leak-detector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        working-directory: Avans-thermal-leak-detector
        run: pyinstaller --noconfirm thermal_leak_detector.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thermal-Leak-Detector-Windows
          path: Avans-thermal-leak-detector/dist/Thermal Leak Detector.exe

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: Avans-thermal-leak-detector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        working-directory: Avans-thermal-leak-detector
        run: pyinstaller --noconfirm thermal_leak_detector.spec

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thermal-Leak-Detector-macOS
          path: Avans-thermal-leak-detector/dist/Thermal Leak Detector
